name: text_analysis_service

services:
  nlp_service:
    build: .
    container_name: nlp_service
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_URL: "postgresql+asyncpg://postgres:postgres@db:5432/text_analysis_db"
    working_dir: /app/app
    volumes:
      - ./app:/app/app

  db:
    image: postgres:17
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: text_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./.containers/db:/var/lib/postgresql/data

  pgadmin4:
    image: dpage/pgadmin4:9
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - ./.containers/pgadmin4:/var/lib/pgadmin
    ports:
      - 5050:80
    depends_on:
      - db

