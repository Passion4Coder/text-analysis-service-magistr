name: text_analysis_service

services:
  nlp_service:
    build: .
    container_name: nlp_service
    depends_on:
      - db
      - ollama
    environment:
      # DB
      POSTGRES_URL: 'postgresql+asyncpg://postgres:postgres@db:5432/text_analysis_db'
      ADMIN_SECRET: supersecret
      # Ollama
      OLLAMA_HOST: 'ollama:11434'
      EMBEDDING_MODEL: nomic-embed-text
      LLM_SUMMARY_MODEL: mistral:latest
      # CORS
      CORS_ORIGINS: http://localhost:4200
    working_dir: /app
    ports:
      - '8001:8001'
    volumes:
      - ./app:/app/app

  db:
    image: postgres:17
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: text_analysis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./.containers/db:/var/lib/postgresql/data

  pgadmin4:
    image: dpage/pgadmin4:9
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - 5050:80
    volumes:
      - ./.containers/pgadmin4:/var/lib/pgadmin
    depends_on:
      - db

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    pull_policy: always
    tty: true
    ports:
      - '11434:11434'
    volumes:
      - ./.containers/ollama:/root/.ollama
      - ./ollama.sh:/entrypoint.sh
    entrypoint: ['/usr/bin/bash', '/entrypoint.sh']
